data:
  structures: data/structures
  targets: data/id_prop.csv
  strict: true
  target_normalization: per_atom
  energy_unit: eV
  extensions:
  - .cif
  - .vasp
  - .poscar
  - .xyz
  - .extxyz
lattice:
  vacancy_symbol: X
  slab_vacuum_layers: 6
  layer_tolerance_angstrom: 0.25
  xy_match_tolerance_angstrom: 0.2
  slab_gap_factor: 1.8
  orientation_ratio_tolerance: 0.1
  force_kind: auto
clusters:
  pair_max_shell: 4
  include_triplets: true
  triplet_max_shell: 2
  shell_tolerance: 0.08
regression:
  random_seed: 42
  test_fraction: 0.1
  cv_folds: 5
  alpha_log10_min: -8
  alpha_log10_max: 2
  n_alphas: 31
output:
  directory: ce_training_output
